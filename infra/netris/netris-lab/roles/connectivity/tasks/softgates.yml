---
- name: Build softgate list
  set_fact:
    softgates: >-
      {%- set result = [] -%}
      {%- for i in range(ns_fabric.softgate_count) -%}
        {%- set _ = result.append({
          'name': 'ns-softgate-' ~ i,
          'mgmt_ip': '10.3.3.' ~ (i + 1),
          'main_ip': '10.2.3.' ~ (i + 1),
          'role': (ns_fabric.softgate_roles | from_json)[i]
        }) -%}
      {%- endfor -%}
      {{ result }}

- name: Get traefik NodePort
  shell: kubectl get svc traefik -n kube-system -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_np
  changed_when: false

- name: Refresh Netris auth (cookie from earlier roles may have expired)
  ansible.builtin.include_role:
    name: netris.controller.auth
  vars:
    netris_controller_url: "http://localhost:{{ traefik_np.stdout }}"
    netris_username: "{{ netris_login }}"
    netris_validate_certs: false
    netris_timeout: 30

- name: Get auth token via collection
  ansible.builtin.include_role:
    name: netris.controller.general
  vars:
    netris_controller_url: "http://localhost:{{ traefik_np.stdout }}"
    netris_username: "{{ netris_login }}"
    general_state: read

- name: Wait for mgmt-server DHCP to be active
  no_log: true
  ansible.builtin.shell:
    cmd: >-
      sshpass -p "{{ vm_root_password | default('netris') }}"
      ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5
      root@192.168.122.10 "systemctl is-active isc-dhcp-server"
  register: _dhcp_status
  until: _dhcp_status.stdout == "active"
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for all softgate VMs to be SSH-accessible
  wait_for:
    host: "{{ item.mgmt_ip }}"
    port: 22
    timeout: 600
    sleep: 15
  loop: "{{ softgates }}"

- name: Remove stale SSH host keys for softgates
  shell: ssh-keygen -R {{ item.mgmt_ip }} 2>/dev/null || true
  loop: "{{ softgates }}"
  changed_when: false

# All softgates are polled together under one deadline of 18 minutes (a healthy
# lab needs 5-8). Waiting for them one after another allowed up to 15 minutes
# each, so a stalled softgate ran into the step timeout before any task could say
# which softgate and which download had stalled. The deadline is measured in the
# shell and bounds each SSH check and each sleep too, so slow or hung SSH
# connections cannot stretch the wait; once it has passed, no new check starts and
# a softgate keeps the status of its last check. Each poll prints one
# "<ip> <status>" line per softgate; a softgate whose cloud-init reports an error
# ends the wait at once. When the wait fails, the boot state of every softgate
# that is not done is shown.
- name: Wait for cloud-init to finish on softgates
  block:
    - name: Wait for cloud-init to finish on softgates
      shell: |
        deadline=$((SECONDS + 18 * 60))
        declare -A last=()
        while :; do
          rc=0
          poll=""
          for ip in {{ softgates | map(attribute='mgmt_ip') | join(' ') }}; do
            left=$((deadline - SECONDS))
            [ "${left}" -gt 20 ] && left=20
            if [ "${left}" -ge 1 ]; then
              status=$(timeout "${left}" ssh -n -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@${ip} \
                'cloud-init status 2>/dev/null' 2>/dev/null | sed -n 's/^status: //p')
              last[${ip}]=${status:-unreachable}
            fi
            status=${last[${ip}]:-not polled}
            poll="${poll}${ip} ${status}"$'\n'
            case "${status}" in
              done) ;;
              error*) rc=2 ;;
              *) [ "${rc}" -eq 0 ] && rc=1 ;;
            esac
          done
          left=$((deadline - SECONDS))
          if [ "${rc}" -ne 1 ] || [ "${left}" -le 0 ]; then
            break
          fi
          sleep $((left < 15 ? left : 15))
        done
        printf '%s' "${poll}"
        exit "${rc}"
      args:
        executable: /bin/bash
      register: _sg_cloudinit
      changed_when: false
  rescue:
    - name: Report why cloud-init did not finish on the softgates
      ansible.builtin.include_tasks: vm_boot_report.yml
      vars:
        _sg_not_done: >-
          {{ _sg_cloudinit.stdout_lines | default([]) | reject('search', ' done$')
             | map('split') | map('first') | list }}
        vm_boot_report_reason: >-
          cloud-init did not finish on every softgate in 18 minutes
          (last poll: {{ _sg_cloudinit.stdout_lines | default([]) | join(', ') }})
        vm_boot_report_hosts: "{{ softgates | selectattr('mgmt_ip', 'in', _sg_not_done) | list }}"

- name: Restore lab DNS on softgates
  shell: |
    ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@{{ item.mgmt_ip }} \
      "echo 'nameserver {{ dns_server }}' > /etc/resolv.conf" 2>/dev/null
  loop: "{{ softgates }}"
  changed_when: false

- name: Wait for all softgate agents to become active
  block:
    - name: Wait for all softgate agents to become active
      shell: |
        failed=""
        for ip in {{ softgates | map(attribute='mgmt_ip') | join(' ') }}; do
          status=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 root@${ip} "systemctl is-active netris-sg 2>/dev/null" 2>/dev/null)
          if [ "$status" != "active" ]; then
            failed="${failed} ${ip}"
          fi
        done
        if [ -n "$failed" ]; then
          echo "not ready:${failed}"
          exit 1
        fi
        echo "all active"
      register: _sg_wait
      until: _sg_wait.rc == 0
      retries: 20
      delay: 15
      changed_when: false
  rescue:
    - name: Report why the Netris agent is not active on the softgates
      ansible.builtin.include_tasks: vm_boot_report.yml
      vars:
        _sg_not_ready: "{{ (_sg_wait.stdout | default('') | regex_replace('^not ready:', '')).split() }}"
        vm_boot_report_reason: >-
          netris-sg did not become active on every softgate in 5 minutes
          ({{ _sg_wait.stdout | default('no result') }})
        vm_boot_report_hosts: "{{ softgates | selectattr('mgmt_ip', 'in', _sg_not_ready) | list }}"
        vm_boot_report_units: [netris-sg]

- name: Wait for XDP on general SoftGates
  ansible.builtin.shell: &xdp_check |
    set -euo pipefail
    macs=$(virsh domiflist {{ item.name }} | awk '$2 == "udp" {print tolower($5)}') || exit 2
    [[ -n "$macs" ]] || { echo "No UDP data interfaces found for {{ item.name }}" >&2; exit 2; }
    links=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
      root@{{ item.mgmt_ip }} 'ip -j link show')
    jq -e --arg macs "$macs" '
      . as $links |
      ($macs | split("\n") | map(select(length > 0))) as $expected |
      all($expected[]; . as $mac |
        any($links[]; ((.address // "") | ascii_downcase) == $mac and .xdp.prog.name == "xdp_router"))
    ' <<< "$links"
  args:
    executable: /bin/bash
  loop: "{{ softgates | selectattr('role', 'equalto', 'general') | list }}"
  register: _xdp_wait
  until: _xdp_wait.rc in [0, 2]
  retries: 18
  delay: 10
  failed_when: false
  changed_when: false

- name: Restart XDP on general SoftGates that did not become ready
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=5
    root@{{ item.item.mgmt_ip }} systemctl restart netris-xdp
  loop: >-
    {{ _xdp_wait.results
       | rejectattr('rc', 'equalto', 0)
       | rejectattr('rc', 'equalto', 2)
       | list }}
  loop_control:
    label: "{{ item.item.name }}"

- name: Confirm XDP after restart
  ansible.builtin.shell: *xdp_check
  args:
    executable: /bin/bash
  loop: >-
    {{ _xdp_wait.results
       | rejectattr('rc', 'equalto', 0)
       | map(attribute='item')
       | list }}
  register: _xdp_recheck
  until: _xdp_recheck.rc in [0, 2]
  retries: 18
  delay: 10
  failed_when: _xdp_recheck.rc != 0
  changed_when: false

- name: Wait for E-BGP sessions to establish
  ansible.builtin.include_tasks: ebgp_wait.yml
  vars:
    netris_controller_url: "http://localhost:{{ traefik_np.stdout }}"
    netris_username: "{{ netris_login }}"
