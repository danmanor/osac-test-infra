---
# Lab stage-1 objects: one tenant, one shared PROTOCOLS pool on the data
# network, one NFS view policy, one exported view. The per-tenant objects that
# carry live NAT addresses are handled by configure-vast-tenants after the OSAC
# tenants exist. Idempotent: every object is looked up by name first.

- name: Create the VAST lab objects
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ lab_vast_ssh_key }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - ConnectTimeout=10
      - "centos@{{ lab_vast_mgmt_ip }}"
      - sudo bash -s
    stdin: |
      set -e
      V="https://{{ lab_vast_mgmt_ip }}"
      A="-sk -u admin:{{ lab_vast_admin_password }}"
      api() { curl $A "$@"; }

      TENANT_ID=$(api "$V/api/latest/tenants/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      t=[x for x in d if x["name"]=="lab"]
      print(t[0]["id"] if t else 0)')
      if [ "$TENANT_ID" = 0 ]; then
        api -X POST "$V/api/latest/tenants/" -H 'Content-Type: application/json' \
          -d '{"name":"lab","client_ip_ranges":[["198.51.100.24","198.51.100.31"]]}' \
          -o /dev/null -w 'tenant create %{http_code}\n'
        TENANT_ID=$(api "$V/api/latest/tenants/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      print([x["id"] for x in d if x["name"]=="lab"][0])')
      fi

      POOL_ID=$(api "$V/api/latest/vippools/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      p=[x for x in d if x["name"]=="lab-pool"]
      print(p[0]["id"] if p else 0)')
      if [ "$POOL_ID" = 0 ]; then
        api -X POST "$V/api/latest/vippools/" -H 'Content-Type: application/json' \
          -d "{\"name\":\"lab-pool\",\"role\":\"PROTOCOLS\",\"ip_ranges\":[[\"{{ lab_vast_vip_start }}\",\"{{ lab_vast_vip_end }}\"]],\"subnet_cidr\":{{ lab_vast_data_prefix }},\"gw_ip\":\"{{ lab_vast_data_gateway }}\",\"vlan\":0,\"tenant_id\":$TENANT_ID,\"cnode_ids\":[1,2]}" \
          -o /dev/null -w 'pool create %{http_code}\n'
      fi

      POLICY_ID=$(api "$V/api/latest/viewpolicies/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      p=[x for x in d if x["name"]=="lab-policy"]
      print(p[0]["id"] if p else 0)')
      if [ "$POLICY_ID" = 0 ]; then
        api -X POST "$V/api/latest/viewpolicies/" -H 'Content-Type: application/json' \
          -d "{\"name\":\"lab-policy\",\"tenant_id\":$TENANT_ID,\"access_flavor\":\"NFS4\",\"nfs_read_write\":[\"{{ lab_vast_nat_pool_cidr }}\"],\"nfs_read_only\":[],\"nfs_root_squash\":[\"0.0.0.0/0\"]}" \
          -o /dev/null -w 'viewpolicy create %{http_code}\n'
        POLICY_ID=$(api "$V/api/latest/viewpolicies/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      print([x["id"] for x in d if x["name"]=="lab-policy"][0])')
      fi

      api "$V/api/latest/views/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      raise SystemExit(0 if [x for x in d if x.get("path")=="{{ lab_vast_view_path }}"] else 1)' \
      || api -X POST "$V/api/latest/views/" -H 'Content-Type: application/json' \
           -d "{\"name\":\"lab-storage\",\"path\":\"{{ lab_vast_view_path }}\",\"policy_id\":$POLICY_ID,\"tenant_id\":$TENANT_ID,\"protocols\":[\"NFS\"]}" \
           -o /dev/null -w 'view create %{http_code}\n'

      api "$V/api/latest/vippools/" | python3 -c '
      import json,sys
      d=json.load(sys.stdin)
      p=[x for x in d if x["name"]=="lab-pool"]
      assert p, "lab-pool missing"
      p=p[0]
      print("pool", p["ip_ranges"], "tenant", p["tenant_id"], "cnode_ids", p.get("cnode_ids"))'
      nc -z -w3 "{{ lab_vast_vip_start }}" 2049 && echo "nfs port reachable"
  register: _lab_vast_objects
  changed_when: "'create 201' in _lab_vast_objects.stdout or 'create 200' in _lab_vast_objects.stdout"
